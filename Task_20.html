<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event</title>
</head>
<body>
    <button id="button">Click</button>
    <input type="text" oninput="txt()" id="txt" placeholder="Type something..." />
    <form id="myForm">
        <input type="text" id="Name" placeholder="Enter Username"/>
        <button type="submit">Submit</button>
    </form>
    <h1 id="output"></h1>
    <h3 id="result"></h3>
    <script>
        let button = document.getElementById("button");
        button.addEventListener("click", ()=>
        {
            alert("button is clicked!");
        });

        function txt()
        {
            let txt = document.getElementById("txt");
            document.getElementById("output").innerText = txt.value;
            let output = document.getElementById("output").innerText;
            console.log(output);
        }

        let form = document.getElementById('myForm');
        form.addEventListener('submit', (event) => 
        {
            event.preventDefault(); 
            let Name = document.getElementById("Name").value;
            document.getElementById("result").textContent = "Hello " + Name;    
        });

    </script>
</body>
</html>
